<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>Challenge: Seasonal ids</title>
        <style>
        body {background-color:blue}
        h1 { color:rgb(72, 157, 231); }
        h2 { color:rgb(255, 102, 0)}
        p { color:rgb(244, 240, 248)}    
        #winter {color:aliceblue; background-color:rgb(6, 8, 4)}
        #summer-man {color:yellow; background-color:black}

        </style>
    </head>
    <body>
        
        <h1>Olaf's favorite seasons</h1>
        
        <h2 id="summer">Summer</h2>
        <p id="summer-man">He's a happy snowman, doing what frozen things do in summer.</p>
        
        <h2 id="winter">Winter</h2>
        <p>He likes to stay in and cuddle</p>

        <h2>Olaf is gonna melt</h2>
    </body>
</html>
